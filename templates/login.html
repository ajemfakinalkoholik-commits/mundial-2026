{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h2>Zaloguj się</h2>
    <p style="color: var(--text-secondary); margin-bottom: 30px;">Wpisz swój email z Białej Listy, aby wejść do gry.</p>
    <form method="POST">
        <input type="email" name="email" placeholder="Twój adres email" required>
        <button type="submit">Wejdź do Gry</button>
    </form>
</div>
{% endblock %}
